# Controleert elke pull request: tests en bouwen moeten slagen.
name: Controleren

on:
  pull_request:

permissions:
  contents: read

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
